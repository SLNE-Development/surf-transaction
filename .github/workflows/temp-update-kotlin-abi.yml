name: Temporary Kotlin ABI update

on:
  push:
    branches:
      - version/26.1
    paths:
      - .github/workflows/temp-update-kotlin-abi.yml

permissions:
  contents: write

jobs:
  update-kotlin-abi:
    name: Regenerate and verify Kotlin ABI
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      SLNE_RELEASES_REPO_USERNAME: ${{ secrets.SLNE_RELEASES_REPO_USERNAME }}
      SLNE_RELEASES_REPO_PASSWORD: ${{ secrets.SLNE_RELEASES_REPO_PASSWORD }}
    steps:
      - name: Check out current branch
        uses: actions/checkout@v6.0.2
        with:
          ref: version/26.1

      - name: Set up GraalVM JDK
        uses: actions/setup-java@v5
        with:
          distribution: graalvm
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          allow-snapshot-wrappers: true

      - name: Update Kotlin ABI
        run: |
          chmod +x ./gradlew
          ./gradlew :surf-transaction-api:updateKotlinAbi --no-scan --stacktrace

      - name: Verify Kotlin ABI
        run: ./gradlew checkKotlinAbi --parallel --no-scan --stacktrace

      - name: Commit and push generated snapshot
        shell: bash
        run: |
          set -euo pipefail
          git add surf-transaction-api/api/surf-transaction-api.api
          if git diff --cached --quiet; then
            echo "Kotlin ABI snapshot is already up to date."
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore: regenerate Kotlin ABI with Gradle"
            git push origin HEAD:version/26.1
          fi
